<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="fragments/header :: header"></head>
<body>
<div th:replace="fragments/navigation :: navigation"></div>
<div class="container">
    <h2>Сеанс № <span th:text="${filmSession.id}"></span></h2>
    <img th:src="@{/images/{image}(image=${film.id} + '.jpg')}" alt="filmImage" width="150">
    <h4>Фильм - <span th:text="${film.name}"></span></h4>
        <h4>Зал - <span th:text="${hall.name}"></span>:
        в зале <span th:text="${hall.rowCount}"></span> рядов
        и <span th:text="${hall.placeCount}"></span> мест
    </h4>

    <form class="mt-3" th:action="@{/tickets/buy}" method="post" enctype="multipart/form-data">

        <input type="hidden" name="sessionId" id="sessionId" th:value="${filmSession.id}">
        <input type="hidden" name="userId" id="userId" value="1">

        <div class="mb-3">
            <label for="rowNumber" class="form-label"><b>Выберите место:</b></label>
            <input type="number" class="form-control" name="rowNumber" id="rowNumber" min="1" th:max="${hall.rowCount}"
                   placeholder="Выберите ряд">
            <input type="number" class="form-control" name="placeNumber" id="placeNumber" min="1"
                   th:max="${hall.placeCount}"
                   placeholder="Выберите номер места">
        </div>

        <div class="col-6">
            <div class="row">
                <div class="col-6"><a class="btn btn-danger w-100"
                                      th:href="@{/sessions}">Отмена</a></div>
                <div class="col-6">
                    <button class="btn btn-primary w-100" type="submit">Сохранить</button>
                </div>
            </div>
        </div>
    </form>
</div>
<footer th:include="blocks/footer :: footer"></footer>
</body>
</html>
